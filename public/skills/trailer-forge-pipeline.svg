<svg xmlns="http://www.w3.org/2000/svg" width="680" height="576" viewBox="0 0 680 576" role="img" aria-labelledby="tfTitle tfDesc">
  <title id="tfTitle">trailer-forge pipeline</title>
  <desc id="tfDesc">Your idea flows down through plan, stills, animate, and sound, ending in a finished trailer. A review gate with capped retries sits beside the stills and animate steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d83a2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <g>
      <rect x="200" y="40" width="280" height="56" rx="10" fill="#12110f" stroke="#4a4336" stroke-width="1"/>
      <text x="340" y="63" text-anchor="middle" font-size="14" letter-spacing="2" fill="#efe7d6">YOUR IDEA</text>
      <text x="340" y="82" text-anchor="middle" font-size="10" letter-spacing="1" fill="#a99b86">LOGLINE + REFERENCE IMAGES</text>
    </g>
    <line x1="340" y1="98" x2="340" y2="122" stroke="#d83a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="200" y="128" width="280" height="56" rx="10" fill="#12110f" stroke="#4a4336" stroke-width="1"/>
      <text x="340" y="151" text-anchor="middle" font-size="14" letter-spacing="2" fill="#d83a2e">PLAN</text>
      <text x="340" y="170" text-anchor="middle" font-size="10" letter-spacing="1" fill="#a99b86">STYLE RULES + CAUSAL SHOTS</text>
    </g>
    <line x1="340" y1="186" x2="340" y2="210" stroke="#d83a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="200" y="216" width="280" height="56" rx="10" fill="#12110f" stroke="#4a4336" stroke-width="1"/>
      <text x="340" y="239" text-anchor="middle" font-size="14" letter-spacing="2" fill="#d83a2e">STILLS</text>
      <text x="340" y="258" text-anchor="middle" font-size="10" letter-spacing="1" fill="#a99b86">ONE KEYFRAME PER SHOT</text>
    </g>
    <line x1="340" y1="274" x2="340" y2="298" stroke="#d83a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="200" y="304" width="280" height="56" rx="10" fill="#12110f" stroke="#4a4336" stroke-width="1"/>
      <text x="340" y="327" text-anchor="middle" font-size="14" letter-spacing="2" fill="#d83a2e">ANIMATE</text>
      <text x="340" y="346" text-anchor="middle" font-size="10" letter-spacing="1" fill="#a99b86">EACH STILL BECOMES A CLIP</text>
    </g>
    <line x1="340" y1="362" x2="340" y2="386" stroke="#d83a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="200" y="392" width="280" height="56" rx="10" fill="#12110f" stroke="#4a4336" stroke-width="1"/>
      <text x="340" y="415" text-anchor="middle" font-size="14" letter-spacing="2" fill="#d83a2e">SOUND</text>
      <text x="340" y="434" text-anchor="middle" font-size="10" letter-spacing="1" fill="#a99b86">SCORE, VOICEOVER, EFFECTS</text>
    </g>
    <line x1="340" y1="450" x2="340" y2="474" stroke="#d83a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="200" y="480" width="280" height="56" rx="10" fill="#d83a2e" stroke="#d83a2e" stroke-width="1"/>
      <text x="340" y="503" text-anchor="middle" font-size="14" letter-spacing="2" fill="#f4ead6">FINISHED TRAILER</text>
      <text x="340" y="522" text-anchor="middle" font-size="10" letter-spacing="1" fill="#f4ead6" opacity="0.75">ONE CUT + REDO FILES</text>
    </g>
    <g>
      <rect x="490" y="250" width="150" height="56" rx="10" fill="none" stroke="#6b5f4e" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="565" y="273" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#a99b86">REVIEW GATE</text>
      <text x="565" y="291" text-anchor="middle" font-size="10" letter-spacing="1" fill="#6b5f4e">CAPPED RETRIES</text>
    </g>
    <line x1="490" y1="270" x2="482" y2="246" stroke="#6b5f4e" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="490" y1="286" x2="482" y2="330" stroke="#6b5f4e" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
</svg>
